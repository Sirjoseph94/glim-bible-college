name: Deploy

# Runs after CI passes on main (TRD §22.5, ADR-0004): build and push the image to GitHub's
# container registry, deploy staging (deploy.sh migrates first), smoke-test it, then deploy
# production once a reviewer approves the "production" environment.
# "Run workflow" (on main) redeploys the current commit, e.g. after changing a variable or secret.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        # Registry names must be lower-case.
        run: echo "image=ghcr.io/${OWNER,,}/glim:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -f docker/Dockerfile -t "${{ steps.name.outputs.image }}" .
      - name: Container scan (Trivy)
        # v0.35.0, pinned by commit: the old unprefixed tags (0.28.0) no longer exist.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.name.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push "${{ steps.name.outputs.image }}"

  # Only when the repository variable STAGING_ENABLED is "true" (decisions.md OPS-1); otherwise
  # production deploys straight after the image, still behind its required reviewers.
  staging:
    needs: image
    if: vars.STAGING_ENABLED == 'true'
    uses: ./.github/workflows/deploy-vps.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: [image, staging]
    # A skipped staging lets production run; a failed one stops it.
    if: >-
      !cancelled() && needs.image.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.staging.result)
    uses: ./.github/workflows/deploy-vps.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
