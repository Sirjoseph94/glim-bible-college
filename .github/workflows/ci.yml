name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm deps:check
      - run: pnpm test
      - run: pnpm budget:check

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t glim:ci .
      # The image has no pnpm, so start each entry point the way deploy/compose.yaml does. With no
      # settings, each must load its code and stop at the config check.
      - name: Entry points start
        run: |
          check() {
            out=$(docker run --rm -e NODE_ENV=production "$@" 2>&1) && { echo "$out"; exit 1; }
            grep -q "Invalid configuration" <<<"$out" || { echo "$out"; exit 1; }
          }
          tsx=(node_modules/.bin/tsx --tsconfig ../../tsconfig.base.json)
          check glim:ci
          check -w /app/apps/worker glim:ci "${tsx[@]}" src/main.ts
          check -w /app/packages/db glim:ci "${tsx[@]}" src/bin/migrate.ts
          echo "api, worker and migrate start"
      # Trivy (TRD §21.2 security checklist): the image's OS packages and the lockfile's
      # dependencies, failing on fixable HIGH or CRITICAL vulnerabilities.
      - name: Trivy image scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress glim:ci
      - name: Trivy dependency scan
        run: >
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest
          fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress /repo

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The weekly backup test runs the real pg_dump, which must match the server (18).
      - name: Install pg_dump 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
      # Testcontainers starts Postgres 18 and MinIO on the runner's Docker.
      - run: pnpm test:integration
        env:
          PG_DUMP_PATH: /usr/lib/postgresql/18/bin/pg_dump

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glim/web exec playwright install --with-deps chromium
      # The e2e server starts Postgres 18 with Testcontainers.
      - run: pnpm test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glim/web build
      # LCP <= 4 s on slow 4G, public and signed-in screens (apps/web/lighthouserc*.cjs); the e2e
      # stack serves the build.
      - name: Lighthouse CI
        working-directory: apps/web
        run: node scripts/lighthouse.mjs
