# Local development stack: Postgres 18, MinIO (S3 / DO Spaces stand-in) and Mailpit (SMTP sink).
name: glim
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glim
    ports:
      - "${GLIM_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glim"]
      interval: 2s
      retries: 30
  minio:
    # MinIO no longer publishes official images; Bitnami's legacy build is the same server.
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: glim-files,glim-backups
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
  miniodata:
